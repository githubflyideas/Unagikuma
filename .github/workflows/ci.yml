name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: smoke test of the binary
        run: make build && scripts/smoke.sh bin/unagikuma
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: web UI syntax and lint
        env:
          CHECKJS_LINT: "1"
        run: scripts/checkjs.sh
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: playwright
        # The runner's own Chrome is used when there is one: installing a
        # browser pulls packages from the Ubuntu mirrors, which the runner
        # cannot always reach.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "UNAGIKUMA_E2E_CHROME=$chrome" >> "$GITHUB_ENV"
            "$chrome" --version
            exit 0
          fi
          for i in 1 2 3; do
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD= npx playwright install --with-deps chromium && exit 0
            sleep 30
          done
          exit 1
      - name: browser tests and failover
        env:
          UNAGIKUMA_E2E_UI: "1"
          UNAGIKUMA_E2E_OUT: ${{ runner.temp }}/e2e
        run: mkdir -p "$UNAGIKUMA_E2E_OUT" && go test -tags e2e -count=1 -v -timeout 20m ./e2e/
      - name: screenshots of failed steps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e
  os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
  cross:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: release archives (CGO_ENABLED=0)
        run: make dist VERSION=ci
      - name: windows vet
        run: GOOS=windows go vet ./...
