name: release
on:
  push:
    tags: ['v*']
  # Releasing from the Actions page (or the API): the version is tagged on
  # the commit the run is started from, normally main.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.5.1 (CHANGELOG.md needs a "## v1.5.1" section)'
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.version || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing: cosign exchanges a GitHub OIDC token for a
      # short-lived certificate; no signing key is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: version
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must look like v1.2.3, got $TAG"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG exists already"; exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: checks
        run: |
          test -z "$(gofmt -l . | tee /dev/stderr)"
          go vet ./...
          go test ./...
      - name: build archives
        run: scripts/dist.sh "$TAG"
      - name: sbom
        # CycloneDX 1.6 SBOM of the Go module, with syft (pinned). The
        # cataloger restriction keeps CI tooling out: the components
        # are exactly the modules in go.mod. The SBOM's own checksum
        # joins SHA256SUMS before it is signed, so it is covered by
        # the signature too.
        run: |
          curl -sSfL "https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin syft
          syft scan dir:. --override-default-catalogers go-module-file-cataloger --select-catalogers=-file \
            --source-name unagikuma --source-version "$TAG" \
            --output "cyclonedx-json@1.6=dist/unagikuma-$TAG-sbom.cdx.json"
          (cd dist && sha256sum "unagikuma-$TAG-sbom.cdx.json" >>SHA256SUMS)
      - uses: sigstore/cosign-installer@v3
        with:
          # Pinned: v2's sign-blob writes the separate signature and
          # certificate files the README's verify command uses.
          cosign-release: 'v2.5.3'
      - name: sign checksums
        run: |
          cosign sign-blob dist/SHA256SUMS --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem
      - name: release notes
        # The section of CHANGELOG.md whose heading starts with the tag.
        run: |
          awk -v tag="## $TAG" '/^## / { on = index($0, tag) == 1; next } on' CHANGELOG.md >dist/NOTES.md
          test -s dist/NOTES.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made on github.com with this tag gets the files added.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/unagikuma-* dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.pem --clobber
            # Fill in notes left empty when the release was made by hand.
            if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
              gh release edit "$TAG" --title "unagikuma $TAG" --notes-file dist/NOTES.md
            fi
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # The release creates the tag on the commit this run built.
            gh release create "$TAG" dist/unagikuma-* dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.pem \
              --title "unagikuma $TAG" --notes-file dist/NOTES.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" dist/unagikuma-* dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.pem \
              --title "unagikuma $TAG" --notes-file dist/NOTES.md --verify-tag
          fi
