pid /tmp/live/nginx.pid;
error_log /tmp/live/nginx.err;
events {}
http {
  access_log off;
  client_body_temp_path /tmp/live/nb; proxy_temp_path /tmp/live/np; fastcgi_temp_path /tmp/live/nf; uwsgi_temp_path /tmp/live/nu; scgi_temp_path /tmp/live/ns;
  server {
    listen 127.0.0.1:18080;
    root /tmp/live;
    location /nginx_status { stub_status; }
    location = /status { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass 127.0.0.1:19000; }
    location / { return 200 "ok\n"; }
  }
}
