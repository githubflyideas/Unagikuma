global
  pidfile /tmp/live/haproxy.pid
defaults
  mode http
  timeout connect 3s
  timeout client 10s
  timeout server 10s
frontend fe
  bind 127.0.0.1:18084
  http-request use-service prometheus-exporter if { path /metrics }
  default_backend app
backend app
  server s1 127.0.0.1:18080 check
  server s2 127.0.0.1:1 check
